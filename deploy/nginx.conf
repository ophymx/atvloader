# nginx in front of atvloader with oauth2-proxy guarding the admin side.
#
#   /admin/ and /api/v1/admin/  -> require a login via oauth2-proxy (auth_request),
#                                   except requests carrying an API token
#                                   (Authorization: Bearer atv_...), which
#                                   atvloader verifies itself
#   /api/v1/device/*, /api/v1/info, /api/v1/apps* -> pass straight through;
#                                   TVs authenticate with their own bearer token
#   /  and /atvloader.apk       -> public: the front page a TV browser uses to
#                                   download the loader for the first install
#
# Assumes oauth2-proxy listens on 127.0.0.1:4180 and was started with
# --set-xauthrequest=true (so it returns X-Auth-Request-User / -Email).

upstream atvloader { server 127.0.0.1:8080; }

server {
    listen 443 ssl http2;
    server_name apps.home.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    client_max_body_size 2g;          # APK uploads
    proxy_request_buffering off;      # stream uploads instead of spooling to disk
    proxy_read_timeout 600s;

    # oauth2-proxy endpoints
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # Scripts and CI authenticate with an API token instead of a login.
    # nginx cannot skip auth_request per header, so send those requests to
    # a twin location without it. The identity headers are stripped so a
    # token cannot be combined with a forged user.
    location ~ ^/(admin|api/v1/admin)(/|$) {
        if ($http_authorization ~* "^Bearer atv_") {
            rewrite ^ /_token$uri last;
        }
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;

        proxy_pass http://atvloader;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/_token/(.*)$ {
        internal;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_pass http://atvloader/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything the TV talks to. Never let a client forge the identity header.
    location / {
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_pass http://atvloader;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
